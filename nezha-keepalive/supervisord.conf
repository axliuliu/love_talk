; nezha-agent supervisor 配置（supervisor 4.x）
; 生产路径按 /opt/nezha 约定；换路径时整份替换前缀即可
[unix_http_server]
file=/opt/nezha/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/opt/nezha/logs/supervisord.log
pidfile=/opt/nezha/run/supervisord.pid
childlogdir=/opt/nezha/logs
logfile_maxbytes=10MB
logfile_backups=3
minfds=1024

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///opt/nezha/run/supervisor.sock

; ---- 被守护的 agent ----
[program:nezha-agent]
command=/opt/nezha/agent/nezha-agent -c /opt/nezha/agent/config.yml
directory=/opt/nezha/agent
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/nezha/logs/nezha-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
priority=10

; ---- 每 10 秒检查连通性，掉线则 supervisorctl restart nezha-agent ----
[program:nezha-autoheal]
command=/opt/nezha/nezha-autoheal.sh
autostart=true
autorestart=true
startsecs=3
startretries=9999
stdout_logfile=/opt/nezha/logs/autoheal.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
priority=20
environment=NZ_SUPERVISOR="1",NZ_INTERVAL="10",NZ_FAIL_THRESHOLD="1",SUPERVISOR_CONF="/etc/supervisor/supervisord.conf",NZ_SUPERVISORCTL="/usr/bin/supervisorctl",NZ_CHECK="/usr/local/bin/nezha-keepalive.sh",NZ_AGENT_BIN="/opt/nezha/agent/nezha-agent",NZ_AGENT_CONF="/opt/nezha/agent/config.yml",NZ_LOG_FILE="/opt/nezha/logs/keepalive.log",NZ_STATE_DIR="/opt/nezha/state",NZ_AGENT_OUT_LOG="/opt/nezha/logs/agent-fallback.out",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
